name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      vsn: ${{ steps.vsn.outputs.vsn }}
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3.27.0'

      - name: Compute version
        id: vsn
        run: |
          VSN=""
          if [[ "$GITHUB_REF_NAME" == v* ]]; then VSN="${GITHUB_REF_NAME#v}"; fi
          if [ -z "$VSN" ]; then VSN=$(sed -n 's/.*{ezx, "\([^"]*\)"}.*/\1/p' rebar.config | head -1); fi
          echo "vsn=$VSN" >> "$GITHUB_OUTPUT"
          echo "Building v$VSN"

      - name: Build release and packages
        run: |
          make deb tgz VSN=${{ steps.vsn.outputs.vsn }}
          sha256sum "dist/ezx-${{ steps.vsn.outputs.vsn }}-linux-x86_64.tar.gz" > "dist/ezx-${{ steps.vsn.outputs.vsn }}-linux-x86_64.tar.gz.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.vsn.outputs.vsn }}
          files: |
            dist/ezx-*.tar.gz
            dist/ezx-*.tar.gz.sha256
            dist/ezx_*.deb
          fail_on_unmatched_files: true

  windows:
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3.27.0'

      - name: Build release
        run: rebar3 as prod release

      - name: Bundle sox for Windows audio
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $priv = Get-ChildItem "_build/prod/rel/ezx/lib/ezx-*/priv" | Select-Object -First 1 -ExpandProperty FullName
          if (-not $priv) { throw "priv dir not found in the release" }
          $bin = Join-Path $priv "bin"
          New-Item -ItemType Directory -Force $bin | Out-Null
          Copy-Item "packaging/sox-win32/*" -Destination $bin -Recurse
          Write-Host "sox bundled into $bin"

      - name: Strip debug symbols from the release
        shell: powershell
        run: |
          $pdb = Get-ChildItem "_build/prod/rel/ezx" -Recurse -Filter *.pdb
          if ($pdb) {
            $pdb | Remove-Item -Force
            Write-Host "removed $($pdb.Count) .pdb files"
          } else {
            Write-Host "no .pdb files found"
          }

      - name: Package Windows zip
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path _build/prod/rel/ezx -DestinationPath "dist/ezx-${{ needs.release.outputs.vsn }}-windows-x86_64.zip"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build NSIS installer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $makensis = "C:\Program Files (x86)\NSIS\makensis.exe"
          if (-not (Test-Path $makensis)) {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $makensis = $cmd.Source } else { throw "makensis not found" }
          }
          & $makensis "-DVERSION=${{ needs.release.outputs.vsn }}" "-DRELDIR=$env:GITHUB_WORKSPACE\_build\prod\rel\ezx\*" "-DOUTFILE=$env:GITHUB_WORKSPACE\dist\ezx-setup-${{ needs.release.outputs.vsn }}.exe" packaging/ezx.nsi
          if ($LASTEXITCODE -ne 0) { throw "makensis failed" }
          Write-Host "built $env:GITHUB_WORKSPACE\dist\ezx-setup-${{ needs.release.outputs.vsn }}.exe"

      - name: Upload Windows zip and installer
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.vsn }}
          files: |
            dist/ezx-${{ needs.release.outputs.vsn }}-windows-x86_64.zip
            dist/ezx-setup-${{ needs.release.outputs.vsn }}.exe
          fail_on_unmatched_files: true
