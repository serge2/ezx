name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          rebar3-version: '3.27.0'

      - name: Build release and packages
        run: |
          make deb tgz VSN=${GITHUB_REF_NAME#v}
          sha256sum "dist/ezx-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz" > "dist/ezx-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ezx-*.tar.gz
            dist/ezx-*.tar.gz.sha256
            dist/ezx_*.deb
          fail_on_unmatched_files: true
